name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake unzip
          python -m pip install -r kit/requirements-dev.txt
      - name: Install Ghidra 12.1.3
        run: |
          GHIDRA_ZIP="$RUNNER_TEMP/ghidra_12.1.3_PUBLIC_20260817.zip"
          curl -fL --retry 5 --retry-delay 5 -o "$GHIDRA_ZIP" "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip"
          echo "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  $GHIDRA_ZIP" | sha256sum -c -
          unzip -q "$GHIDRA_ZIP" -d "$RUNNER_TEMP"
          echo "GHIDRA_HOME=$RUNNER_TEMP/ghidra_12.1.3_PUBLIC" >> "$GITHUB_ENV"
      - name: Require private NFSMW input
        run: |
          if [ ! -f original/retail/speed.exe ]; then
            echo "::error::Missing original/retail/speed.exe. Do not commit it to this public repository."
            echo "::error::The private game input must be staged on the runner before this step."
            exit 2
          fi
          echo "80774c2e5d619b4f120b48d4462896fd504c263399d203a238769cffde1d253c  original/retail/speed.exe" | sha256sum -c -
      - name: Analyze NFSMW
        run: python tools/analyze.py --ghidra-home "$GHIDRA_HOME" --java-home "$JAVA_HOME_21_X64"
      - name: Regenerate translation and build Android
        run: python tools/build.py --regenerate --target android --jobs 8 --no-install
      - name: Verify generated translation
        run: |
          test -f build/recomp/gen/table.c
          test -f build/recomp/symbols.json
          find build/recomp/gen -maxdepth 1 -type f | wc -l
      - name: Find APK
        if: always()
        run: find . -type f \( -name "*.apk" -o -name "libmain.so" \) -print || true
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-android-arm64
          path: |
            build/android/app/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
