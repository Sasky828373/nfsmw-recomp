name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-port

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Show Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          python --version
          cmake --version
          ninja --version
          java -version

      - name: Build Android stub APK
        run: |
          python tools/build.py --target android --stub

      - name: Find APK
        if: always()
        run: |
          find . -type f \( -name "*.apk" -o -name "*.aab" -o -name "libmain.so" \) -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-android-stub
          path: |
            build/android/app/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
